<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient: Deep Indigo to Crimson with Apple-like Vibrancy -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#31103f" />
    </linearGradient>

    <!-- Glass Surface Gradient -->
    <linearGradient id="glassGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.28)" />
      <stop offset="50%" stop-color="rgba(255, 255, 255, 0.08)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.16)" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.6)" />
      <stop offset="50%" stop-color="rgba(99, 102, 241, 0.3)" />
      <stop offset="100%" stop-color="rgba(236, 72, 153, 0.5)" />
    </linearGradient>

    <!-- Letter A Gradient -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Letter 文 Gradient -->
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <filter id="glassShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000000" flood-opacity="0.55" />
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Base Apple-style squircle background -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGrad)" filter="url(#glassShadow)" />

  <!-- Inner Frosted Glass Layer -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#glassGrad)" stroke="url(#borderGrad)" stroke-width="3" />

  <!-- Subtle Radial Light Specular Reflection -->
  <ellipse cx="140" cy="110" rx="180" ry="70" fill="rgba(255, 255, 255, 0.12)" />

  <!-- Modern Dual-Language Glyph: "文" and "A" Interlocking -->
  <g transform="translate(116, 126)">
    <!-- English Letter "A" -->
    <path d="M 64 220 L 128 40 L 192 220 L 152 220 L 138 180 L 118 180 L 104 220 Z M 128 140 L 133 158 L 123 158 Z" 
          fill="url(#blueGrad)" opacity="0.95" />

    <!-- Chinese Character "文" (Stylized Modern Calligraphic) -->
    <!-- Top Dot / Head -->
    <circle cx="210" cy="46" r="14" fill="url(#purpleGrad)" />
    <!-- Horizontal Cross -->
    <rect x="140" y="80" width="140" height="20" rx="10" fill="url(#purpleGrad)" />
    <!-- Left falling stroke撇 -->
    <path d="M 215 100 Q 195 160 148 215 Q 165 220 185 205 Q 220 160 228 100 Z" fill="url(#purpleGrad)" />
    <!-- Right falling stroke捺 -->
    <path d="M 205 110 Q 235 165 285 220 Q 270 222 250 212 Q 215 170 198 110 Z" fill="url(#purpleGrad)" />
  </g>

  <!-- Ambient Floating Particle Sparkles -->
  <circle cx="100" cy="380" r="6" fill="#60a5fa" opacity="0.8" />
  <circle cx="390" cy="140" r="5" fill="#f43f5e" opacity="0.8" />
  <circle cx="380" cy="360" r="8" fill="#a78bfa" opacity="0.7" />
  <circle cx="340" cy="410" r="4" fill="#38bdf8" opacity="0.6" />
</svg>
